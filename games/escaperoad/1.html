<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Escape Road</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#unity-canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #000;
    color: white;
    font: 16px Arial, sans-serif;
    z-index: 10;
}

#bar {
    width: 50%;
    max-width: 500px;
    height: 12px;
    border: 1px solid #777;
    margin-top: 15px;
}

#progress {
    width: 0%;
    height: 100%;
    background: white;
}
</style>
</head>

<body>

<canvas id="unity-canvas"></canvas>

<div id="loading">
    <div id="status">Starting Escape Road...</div>
    <div id="bar"><div id="progress"></div></div>
</div>

<script>
const ROOT =
    "https://cdn.jsdelivr.net/gh/wgfwpnew/assets@4d9d9f111749b11b9dd25ccd5818aa70d846e53f/escaperoad/";

const canvas = document.getElementById("unity-canvas");
const loading = document.getElementById("loading");
const status = document.getElementById("status");
const progress = document.getElementById("progress");

function loadScript(url) {
    return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = url;
        script.onload = resolve;
        script.onerror = () =>
            reject(new Error("Failed to load " + url));
        document.body.appendChild(script);
    });
}

async function start() {
    status.textContent = "Loading Unity...";

    await loadScript(ROOT + "TemplateData/loader.js");

    /*
     * Escape Road's additional SDK/game integration script.
     * This should be the patched random.js where the empty
     * dynamic script URL and unguarded Firebase calls were fixed.
     */
    await loadScript(ROOT + "random.js");

    if (typeof createUnityInstance !== "function") {
        throw new Error("createUnityInstance() was not defined");
    }

    const config = {
        dataUrl:
            ROOT + "TemplateData/data.unityweb",

        frameworkUrl:
            ROOT + "TemplateData/framework.js.unityweb",

        codeUrl:
            ROOT + "TemplateData/wasm.unityweb",

        streamingAssetsUrl:
            ROOT + "StreamingAssets",

        companyName: "1games.io",
        productName: "Escape Road",
        productVersion: "2.0"
    };

    status.textContent = "Loading Escape Road...";

    const instance = await createUnityInstance(
        canvas,
        config,
        value => {
            const percent = Math.round(value * 100);
            progress.style.width = percent + "%";
            status.textContent =
                "Loading Escape Road... " + percent + "%";
        }
    );

    window.unityInstance = instance;
    loading.style.display = "none";

    canvas.focus();
}

start().catch(error => {
    console.error(error);
    status.textContent =
        "Escape Road failed to load: " +
        (error.message || error);
});
</script>

</body>
</html>
