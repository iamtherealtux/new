<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Escape Road 2</title>

<style>
html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#unity-canvas {
    display:block;
    width:100%;
    height:100%;
}

#loading {
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#000;
    color:white;
    font:16px Arial,sans-serif;
}

#bar {
    width:min(500px,60vw);
    height:12px;
    margin-top:14px;
    border:1px solid #777;
}

#progress {
    width:0%;
    height:100%;
    background:white;
}
</style>
</head>

<body>

<canvas id="unity-canvas" tabindex="-1"></canvas>

<div id="loading">
    <div id="status">Starting Escape Road 2...</div>
    <div id="bar"><div id="progress"></div></div>
</div>

<script>
const ROOT =
    "https://cdn.jsdelivr.net/gh/wgfwpnew/assets@f5909690e49c9181bb76f7a2d6895ba050dc736d/escaperoad/2/";

const canvas = document.getElementById("unity-canvas");
const loading = document.getElementById("loading");
const status = document.getElementById("status");
const progress = document.getElementById("progress");

// Analytics hook expected by the game.
window.firebaseLogEvent = (...args) => {
    console.debug("[firebaseLogEvent]", ...args);
};

function loadScript(url) {
    return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = url;
        script.onload = resolve;
        script.onerror = () =>
            reject(new Error("Failed to load " + url));
        document.body.appendChild(script);
    });
}

// Download gzip from jsDelivr, decompress it, and create
// a temporary URL containing the original uncompressed data.
async function decompressAsset(filename, mimeType) {
    status.textContent = "Downloading " + filename + "...";

    const response = await fetch(ROOT + filename);

    if (!response.ok) {
        throw new Error(
            filename + " returned HTTP " + response.status
        );
    }

    if (!response.body) {
        throw new Error("Response streaming is unavailable");
    }

    status.textContent = "Decompressing " + filename + "...";

    const stream = response.body.pipeThrough(
        new DecompressionStream("gzip")
    );

    const blob = await new Response(stream, {
        headers: {
            "Content-Type": mimeType
        }
    }).blob();

    console.log(
        "[CDN]",
        filename,
        "decompressed:",
        blob.size,
        "bytes"
    );

    return URL.createObjectURL(blob);
}

async function startGame() {
    if (!window.DecompressionStream) {
        throw new Error(
            "Your browser does not support gzip decompression"
        );
    }

    // Download and decompress both large Unity files.
    const dataURL = await decompressAsset(
        "data.unityweb.gz",
        "application/octet-stream"
    );

    const wasmURL = await decompressAsset(
        "code.wasm.gz",
        "application/wasm"
    );

    status.textContent = "Loading Unity...";

    await loadScript(ROOT + "loader.js");

    if (typeof createUnityInstance !== "function") {
        throw new Error("Unity loader did not initialize");
    }

    const config = {
        dataUrl: dataURL,
        frameworkUrl: ROOT + "framework.js",
        codeUrl: wasmURL,

        streamingAssetsUrl: ROOT + "StreamingAssets",

        companyName: "1games.io",
        productName: "Escape Road 2",
        productVersion: "25102308",

        showBanner: (message, type) => {
            console.log("[Unity " + type + "]", message);
        }
    };

    const instance = await createUnityInstance(
        canvas,
        config,
        value => {
            const percent = Math.round(value * 100);

            progress.style.width = percent + "%";

            status.textContent =
                "Loading Escape Road 2... " + percent + "%";
        }
    );

    window.unityInstance = instance;

    loading.style.display = "none";

    canvas.focus();

    // Unity has loaded the files, so release temporary URLs.
    URL.revokeObjectURL(dataURL);
    URL.revokeObjectURL(wasmURL);
}

startGame().catch(error => {
    console.error("Escape Road 2 failed:", error);

    status.textContent =
        "Failed: " + (error.message || String(error));
});
</script>

</body>
</html>
