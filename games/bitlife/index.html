<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BitLife</title>
<base href="https://cdn.jsdelivr.net/gh/wgfwpnew/assetsasd@main/bitlife/">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
.webgl-content{
    position:relative;
    width:62vh;
    max-width:100vw;
    height:100vh;
    margin:auto;
    overflow:hidden;
}
#gameContainer,#gameContainer>div{
    width:100%!important;
    height:100%!important;
}
#gameContainer canvas{
    display:block;
    width:100%!important;
    height:100%!important;
}
#status{
    position:fixed;
    bottom:10px;
    left:0;
    width:100%;
    color:white;
    text-align:center;
    font:14px Arial;
    z-index:9999;
    pointer-events:none;
}
</style>
</head>

<body>
<div class="webgl-content">
    <div id="gameContainer"></div>
</div>

<div id="status">Loading BitLife...</div>

<script>
const ROOT="https://cdn.jsdelivr.net/gh/wgfwpnew/assets@main/bitlife/";
const status=document.getElementById("status");
let failed=false;

function error(message){
    if(failed)return;
    failed=true;
    status.textContent="BitLife failed to load";
    alert("BitLife Error:\n\n"+message);
}

window.addEventListener("error",e=>{
    if(e.target!==window){
        if(e.target.tagName==="SCRIPT")
            error("Script failed:\n"+e.target.src);
        return;
    }
    error((e.message||"Unknown JavaScript error")+
          (e.filename?"\nFile: "+e.filename:""));
},true);

window.addEventListener("unhandledrejection",e=>{
    error(String(e.reason));
});

const originalOpen=XMLHttpRequest.prototype.open;

XMLHttpRequest.prototype.open=function(method,url,...args){
    if(/BitLife\.json|\.unityweb/i.test(String(url))){
        this.addEventListener("loadend",()=>{
            if(this.status===0||this.status>=400)
                error("Download failed:\n"+url+
                      "\nHTTP "+this.status);
        });
    }
    return originalOpen.call(this,method,url,...args);
};

async function start(){
    if(typeof WebAssembly==="undefined")
        throw Error("WebAssembly unavailable");

    const canvas=document.createElement("canvas");

    if(!canvas.getContext("webgl2")&&!canvas.getContext("webgl"))
        throw Error("WebGL unavailable");

    const script=document.createElement("script");
    script.src=ROOT+"Build/UnityLoader.js";

    script.onerror=()=>{
        error("Could not load:\n"+script.src);
    };

    script.onload=()=>{
        try{
            if(typeof UnityLoader==="undefined")
                throw Error("UnityLoader missing");

            window.game=UnityLoader.instantiate(
                "gameContainer",
                ROOT+"Build/BitLife.json",
                {
                    onProgress:(instance,progress)=>{
                        if(failed)return;

                        status.textContent=
                            "Loading BitLife... "+
                            Math.round(progress*100)+"%";

                        if(progress>=1)
                            status.style.display="none";
                    }
                }
            );
        }catch(e){
            error(String(e));
        }
    };

    document.head.appendChild(script);
}

start().catch(e=>error(String(e)));
</script>
</body>
</html>
