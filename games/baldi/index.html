<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Baldi's Basics</title>

    <base href="https://cdn.jsdelivr.net/gh/wgfwpnew/assetsasd@main/baldi/">

    <link rel="stylesheet" href="TemplateData/style.css">

    <script>

    const originalFetch = window.fetch.bind(window);

    let baldiDataPromise = null;

    async function getBaldiData() {
        if (baldiDataPromise)
            return baldiDataPromise;

        baldiDataPromise = (async () => {
            console.log("[Baldi] Downloading data part 1...");

            const r1 = await originalFetch("unity/baldi.data.unityweb.part1");

            if (!r1.ok)
                throw new Error(
                    "part1 failed: HTTP " + r1.status
                );

            const b1 = await r1.arrayBuffer();

            console.log(
                "[Baldi] Part 1:",
                (b1.byteLength / 1024 / 1024).toFixed(2),
                "MB"
            );

            console.log("[Baldi] Downloading data part 2...");

            const r2 = await originalFetch("unity/baldi.data.unityweb.part2");

            if (!r2.ok)
                throw new Error(
                    "part2 failed: HTTP " + r2.status
                );

            const b2 = await r2.arrayBuffer();

            console.log(
                "[Baldi] Part 2:",
                (b2.byteLength / 1024 / 1024).toFixed(2),
                "MB"
            );

            const merged = new Uint8Array(
                b1.byteLength + b2.byteLength
            );

            merged.set(new Uint8Array(b1), 0);
            merged.set(new Uint8Array(b2), b1.byteLength);

            console.log(
                "[Baldi] Data merged:",
                (merged.byteLength / 1024 / 1024).toFixed(2),
                "MB"
            );

            return merged.buffer;
        })();

        return baldiDataPromise;
    }


    window.fetch = async function(input, init) {
        let url;

        if (typeof input === "string")
            url = input;
        else
            url = input.url;

        if (
            url &&
            url.split("?")[0].endsWith(
                "/unity/baldi.data.unityweb"
            )
        ) {
            console.log(
                "[Baldi] Intercepted Unity data request"
            );

            const buffer = await getBaldiData();

            return new Response(buffer, {
                status: 200,
                headers: {
                    "Content-Type": "application/octet-stream"
                }
            });
        }

        return originalFetch(input, init);
    };


    getBaldiData().catch(error => {
        console.error(
            "[Baldi] Failed to prepare game data:",
            error
        );
    });
    </script>

    <script src="TemplateData/UnityProgress.js"></script>
    <script src="baldi.js"></script>
</head>

<body style="margin:0; background:#000; overflow:hidden;">

    <div class="webgl-content">

        <div
            id="unityContainer"
            style="
                width:960px;
                height:600px;
                padding:0;
                margin:0;
                border:0;
                position:relative;
                background:rgb(35,31,32);
            "
        >

            <div
                id="gameContainer"
                style="
                    width:800px;
                    height:560px;
                    margin:0;
                    padding:0;
                    border:0;
                    position:relative;
                    background:#000;
                "
            ></div>

        </div>

    </div>

    <script>
        var gameInstance = UnityLoader.instantiate(
            "gameContainer",
            "baldi.json",
            {
                onProgress: UnityProgress,

                Module: {
                    onRuntimeInitialized: function () {
                        UnityProgress(
                            gameInstance,
                            "complete"
                        );
                    }
                }
            }
        );
    </script>

</body>
</html>
