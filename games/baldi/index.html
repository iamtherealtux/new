<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Baldi's Basics</title>

    <base href="https://cdn.jsdelivr.net/gh/wgfwpnew/assetsasd@main/baldi/">

    <link rel="stylesheet" href="TemplateData/style.css">

    <script>
        window.fileMergerConfig = {
            files: [
                {
                    name: "baldi.data.unityweb",
                    parts: 2
                },
                {
                    name: "baldi.wasm.code.unityweb",
                    parts: 1
                },
                {
                    name: "baldi.wasm.framework.unityweb",
                    parts: 1
                }
            ],

            basePath: "unity/",
            debug: true
        };
    </script>

    <script src="merger.js"></script>
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="baldi.js"></script>
</head>

<body style="margin:0; background:#000; overflow:hidden;">

    <div class="webgl-content">
        <div
            id="unityContainer"
            style="
                width:960px;
                height:600px;
                margin:0;
                padding:0;
                position:relative;
                background:#231f20;
            "
        >
            <div
                id="gameContainer"
                style="
                    width:800px;
                    height:560px;
                    margin:0;
                    padding:0;
                    position:relative;
                    background:#000;
                "
            ></div>
        </div>
    </div>

    <script>
        var gameInstance = UnityLoader.instantiate(
            "gameContainer",
            "baldi.json",
            {
                onProgress: UnityProgress,

                Module: {
                    onRuntimeInitialized: function () {
                        UnityProgress(
                            gameInstance,
                            "complete"
                        );
                    }
                }
            }
        );
    </script>

</body>
</html>
