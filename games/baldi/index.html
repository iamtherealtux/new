<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Baldi's Basics</title>

    <base href="https://cdn.jsdelivr.net/gh/wgfwpnew/assetsasd@70a991c945169527a46ebb367c125a1882d55a7a/baldi/">

    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
        }

        #loadingMessage {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 9999;
            padding: 6px 10px;
            color: white;
            background: #222;
            font-family: monospace;
            font-size: 14px;
        }
    </style>

    <script src="TemplateData/UnityProgress.js"></script>

    <script>
        window.fileMergerConfig = {
            files: [
                {
                    name: "baldi.data.unityweb",
                    parts: 2
                },
                {
                    name: "baldi.wasm.code.unityweb",
                    parts: 1
                },
                {
                    name: "baldi.wasm.framework.unityweb",
                    parts: 1
                }
            ],

            basePath: "unity/",
            debug: true
        };
    </script>

    <!-- Must run BEFORE baldi.js / UnityLoader -->
    <script src="merger.js"></script>

    <script src="baldi.js"></script>
</head>

<body>

<div id="loadingMessage">Starting Baldi...</div>
<div id="gameContainer"></div>

<script>
window.addEventListener("load", function () {
    const loadingMessage =
        document.getElementById("loadingMessage");

    console.log(
        "[Baldi] UnityLoader:",
        typeof UnityLoader
    );

    try {
        window.gameInstance = UnityLoader.instantiate(
            "gameContainer",
            "baldi.json",
            {
                onProgress: function (gameInstance, progress) {
                    console.log(
                        "[Baldi] Progress:",
                        progress
                    );

                    if (loadingMessage) {
                        loadingMessage.textContent =
                            "Loading Baldi... " +
                            Math.round(progress * 100) +
                            "%";
                    }

                    if (typeof UnityProgress === "function") {
                        UnityProgress(
                            gameInstance,
                            progress
                        );
                    }

                    if (
                        progress >= 1 &&
                        loadingMessage
                    ) {
                        loadingMessage.style.display =
                            "none";
                    }
                }
            }
        );

        console.log(
            "[Baldi] Unity instance created:",
            window.gameInstance
        );

    } catch (error) {
        console.error(
            "[Baldi] Unity startup failed:",
            error
        );

        if (loadingMessage) {
            loadingMessage.textContent =
                "Baldi failed to start — check console.";
        }
    }
});
</script>

</body>
</html>
