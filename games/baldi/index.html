<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Baldi's Basics</title>

    <base href="https://cdn.jsdelivr.net/gh/wgfwpnew/assetsasd@main/baldi/">

    <link rel="stylesheet" href="TemplateData/style.css">

    <script>
        window.fileMergerConfig = {
            files: [
                {
                    name: "baldi.data.unityweb",
                    parts: 2
                },
                {
                    name: "baldi.wasm.code.unityweb",
                    parts: 1
                },
                {
                    name: "baldi.wasm.framework.unityweb",
                    parts: 1
                }
            ],
            basePath: "unity/",
            debug: true
        };
    </script>
    <script src="merger.js"></script>

    <script src="TemplateData/UnityProgress.js"></script>
    <script src="baldi.js"></script>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        .webgl-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #unityContainer {
            width: 960px;
            height: 600px;
            position: relative;
            background: #231f20;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        #loadingMessage {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 10000;

            color: white;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div id="loadingMessage">
    Downloading Baldi...
</div>

<div class="webgl-content">
    <div id="unityContainer">
        <div id="gameContainer"></div>
    </div>
</div>

<script>
(async function () {

    const loadingMessage =
        document.getElementById("loadingMessage");

    const requiredFiles = [
        "baldi.data.unityweb",
        "baldi.wasm.code.unityweb",
        "baldi.wasm.framework.unityweb"
    ];

    console.log("[Baldi] Waiting for Unity files...");
    while (true) {

        const files = window.mergedFiles;

        if (
            files &&
            requiredFiles.every(name => files[name])
        ) {
            break;
        }

        await new Promise(resolve =>
            setTimeout(resolve, 100)
        );
    }

    console.log("[Baldi] All Unity files are ready.");

    for (const name of requiredFiles) {

        const buffer =
            window.mergedFiles[name];

        console.log(
            "[Baldi]",
            name,
            (buffer.byteLength / 1024 / 1024).toFixed(2),
            "MB"
        );
    }

    console.log("[Baldi] Starting Unity...");

    loadingMessage.textContent =
        "Starting Baldi...";

    try {

        window.gameInstance =
            UnityLoader.instantiate(
                "gameContainer",
                "baldi.json",
                {
                    onProgress: UnityProgress,

                    Module: {
                        onRuntimeInitialized:
                            function () {

                                console.log(
                                    "[Baldi] Runtime initialized."
                                );

                                loadingMessage.style.display =
                                    "none";

                                UnityProgress(
                                    window.gameInstance,
                                    "complete"
                                );
                            }
                    }
                }
            );

    } catch (error) {

        console.error(
            "[Baldi] Unity startup failed:",
            error
        );

        loadingMessage.textContent =
            "Baldi failed to start — check console.";
    }

})();
</script>

</body>
</html>
