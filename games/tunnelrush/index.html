<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Tunnel Rush</title>
    <base href="https://cdn.jsdelivr.net/gh/iamtherealtux/tunnel-rush@40050f70c5b20ae7d2fba520765a058b5fe11f8e/">
    <link rel="stylesheet" href="style/style.css">
    <script src="UnityLoader.js"></script>
    <script src="UnityProgress.js"></script>
    <link rel="icon" href="img/tunnel.jpg">
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "build.json", {onProgress: UnityProgress,Module:{onRuntimeInitialized: function() {UnityProgress(gameInstance, "complete")}}});
    </script>
  </head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer" style="width: vw; height: vh; margin: auto;"></div>
    </div>
 	<script type="text/javascript">gameInstance.SetFullscreen(1);</script>
  </body>
</html>
