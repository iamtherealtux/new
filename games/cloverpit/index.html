<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width,height=device-height,initial-scale=1,user-scalable=no"
    >

    <title>Unity Web Player | CloverPit</title>

    <base href="https://cdn.jsdelivr.net/gh/wgfwpnew/clover-pit@main/">

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-container {
            width: 100%;
            height: 100%;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            background: #000;
        }

        #loading-text {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 30px;
            z-index: 1000;

            color: white;
            text-align: center;
            font-family: sans-serif;
            font-size: 16px;

            pointer-events: none;
        }
    </style>
</head>

<body>
<script>
    alert("this will display an error. when you see the errors, click ok and the game will load")
        </script>
<div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
        <div id="unity-logo"></div>

        <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
        </div>
    </div>

    <div id="unity-warning"></div>
</div>

<div id="loading-text">LOADING...</div>

<script>
(async () => {
    const cdnRoot =
        "https://cdn.jsdelivr.net/gh/wgfwpnew/clover-pit@main/";

    const buildUrl = cdnRoot + "Build";

    const container =
        document.querySelector("#unity-container");

    const canvas =
        document.querySelector("#unity-canvas");

    const loadingBar =
        document.querySelector("#unity-loading-bar");

    const progressBarFull =
        document.querySelector("#unity-progress-bar-full");

    const loadingText =
        document.querySelector("#loading-text");


    /*
     * We don't have DevTools on the Chromebooks, so any fatal
     * loading error gets shown in an alert.
     */
    let fatalErrorShown = false;

    function fatal(message) {
        const text =
            "CloverPit failed to load:\n\n" + message;

        if (!fatalErrorShown) {
            fatalErrorShown = true;
            alert(text);
        }

        throw new Error(text);
    }


    /*
     * Also catch unexpected JavaScript errors.
     */
    window.addEventListener("error", event => {
        if (fatalErrorShown)
            return;

        let message = event.message || "Unknown JavaScript error";

        if (event.filename) {
            message +=
                "\n\nFile:\n" +
                event.filename;
        }

        fatalErrorShown = true;

        alert(
            "CloverPit JavaScript error:\n\n" +
            message
        );
    });


    window.addEventListener(
        "unhandledrejection",
        event => {
            if (fatalErrorShown)
                return;

            fatalErrorShown = true;

            alert(
                "CloverPit error:\n\n" +
                String(event.reason)
            );
        }
    );


    /*
     * Download one part.
     *
     * Importantly, we use response.blob() instead of making arrays
     * of Uint8Arrays and then copying everything into another
     * ArrayBuffer.
     */
    async function downloadPart(url) {
        let response;

        try {
            response = await fetch(url);
        } catch (error) {
            fatal(
                "Could not connect while downloading:\n\n" +
                url +
                "\n\n" +
                error
            );
        }

        if (!response.ok) {
            fatal(
                "A game file could not be downloaded.\n\n" +
                "HTTP " +
                response.status +
                " " +
                response.statusText +
                "\n\n" +
                url
            );
        }

        return await response.blob();
    }


    /*
     * Download split files ONE AT A TIME.
     *
     * The old version downloaded all three parts simultaneously,
     * while also keeping multiple copies of the data in memory.
     */
    async function mergeFiles(fileParts, displayName) {
        const blobs = [];

        for (let i = 0; i < fileParts.length; i++) {
            const url = fileParts[i];

            loadingText.textContent =
                "LOADING " +
                displayName +
                "... PART " +
                (i + 1) +
                " / " +
                fileParts.length;

            const blob = await downloadPart(url);

            blobs.push(blob);
        }

        const mergedBlob = new Blob(blobs);

        return URL.createObjectURL(mergedBlob);
    }


    function getParts(file, start, end) {
        const parts = [];

        for (let i = start; i <= end; i++) {
            parts.push(file + ".part" + i);
        }

        return parts;
    }


    /*
     * Download DATA first.
     *
     * Don't download DATA and WASM simultaneously. This keeps
     * peak memory/network usage lower on weaker Chromebooks.
     */
    loadingText.textContent =
        "LOADING GAME DATA...";

    const dataUrl = await mergeFiles(
        getParts(
            buildUrl + "/CloverPit.data",
            1,
            3
        ),
        "GAME DATA"
    );


    /*
     * Then download WASM.
     */
    loadingText.textContent =
        "LOADING GAME CODE...";

    const wasmUrl = await mergeFiles(
        getParts(
            buildUrl + "/CloverPit.wasm",
            1,
            3
        ),
        "GAME CODE"
    );


    /*
     * Unity configuration.
     */
    const loaderUrl =
        buildUrl + "/CloverPit.loader.js";

    const config = {
        arguments: [],

        dataUrl: dataUrl,

        frameworkUrl:
            buildUrl +
            "/CloverPit.framework.js",

        codeUrl: wasmUrl,

        streamingAssetsUrl:
            cdnRoot +
            "StreamingAssets",

        companyName:
            "Panik Arcade",

        productName:
            "CloverPit",

        productVersion:
            "1.3",

        showBanner: (message, type) => {
            if (type === "error") {
                if (!fatalErrorShown) {
                    fatalErrorShown = true;

                    alert(
                        "CloverPit / Unity error:\n\n" +
                        message
                    );
                }
            }
        }
    };


    /*
     * Lower render resolution on devices with very high device
     * pixel ratios. This can save a decent amount of GPU memory.
     */
    if (window.devicePixelRatio > 1.5) {
        config.devicePixelRatio = 1;
    }


    loadingText.textContent =
        "STARTING UNITY...";

    loadingBar.style.display =
        "block";


    /*
     * Load Unity's loader exactly ONCE.
     */
    const loaderScript =
        document.createElement("script");

    loaderScript.src =
        loaderUrl;


    loaderScript.onerror = () => {
        fatal(
            "The Unity loader could not be downloaded.\n\n" +
            loaderUrl
        );
    };


    loaderScript.onload = async () => {
        if (typeof createUnityInstance !== "function") {
            fatal(
                "CloverPit.loader.js downloaded, but " +
                "createUnityInstance() was not found."
            );
        }

        try {
            const unityInstance =
                await createUnityInstance(
                    canvas,
                    config,
                    progress => {
                        progressBarFull.style.width =
                            (progress * 100) + "%";

                        loadingText.textContent =
                            "STARTING GAME... " +
                            Math.round(progress * 100) +
                            "%";
                    }
                );

            window.unityInstance =
                unityInstance;

            loadingBar.style.display =
                "none";

            loadingText.remove();

            window.focus();

        } catch (error) {
            fatal(
                "Unity could not start.\n\n" +
                String(error)
            );
        }
    };


    document.body.appendChild(
        loaderScript
    );

})();
</script>

</body>
</html>
