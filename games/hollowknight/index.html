
<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <base href="https://cdn.jsdelivr.net/gh/iamtherealtux/hollow-knight@latest/">

    <title>Unity WebGL Player | Hollow Knight</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #231F20;
        }

        #unity-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #loading-text {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            color: white;
            font-size: 24px;
            font-family: sans-serif;
            text-align: center;
            z-index: 100;
        }
    </style>
</head>

<body>
    <div id="loading-text">LOADING...</div>

    <div hidden id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas"></canvas>

        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>

        <div id="unity-mobile-warning">
            WebGL builds are not supported on mobile devices.
        </div>
    </div>

    <script>
        "use strict";

        const BASE =
            "https://cdn.jsdelivr.net/gh/iamtherealtux/hollow-knight@latest/";

        const loadingText = document.getElementById("loading-text");
        const container = document.getElementById("unity-container");
        const canvas = document.getElementById("unity-canvas");
        const loadingBar = document.getElementById("unity-loading-bar");
        const progressBarFull =
            document.getElementById("unity-progress-bar-full");
        const mobileWarning =
            document.getElementById("unity-mobile-warning");

        const TOTAL_MB = 860.36;

        let loadedBytes = 0;
        const blobURLs = [];

        function absoluteURL(path) {
            return new URL(path, BASE).href;
        }

        function showError(error) {
            console.error("Hollow Knight loading error:", error);

            loadingText.style.display = "block";
            loadingText.style.color = "#ff7777";
            loadingText.textContent =
                "ERROR: " + (error?.message || String(error));
        }

        async function fetchWithProgress(url) {
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    `Failed to download ${url}: HTTP ${response.status}`
                );
            }

            if (!response.body) {
                throw new Error("ReadableStream unavailable: " + url);
            }

            const reader = response.body.getReader();
            const chunks = [];
            let received = 0;

            while (true) {
                const { done, value } = await reader.read();

                if (done) break;

                chunks.push(value);
                received += value.byteLength;
                loadedBytes += value.byteLength;

                const mbDone =
                    (loadedBytes / (1024 * 1024)).toFixed(2);

                loadingText.textContent =
                    `LOADING... ${mbDone} MB / ${TOTAL_MB} MB`;
            }

            const result = new Uint8Array(received);
            let offset = 0;

            for (const chunk of chunks) {
                result.set(chunk, offset);
                offset += chunk.byteLength;
            }

            return result;
        }

        async function mergeFiles(fileParts, mimeType) {
            const buffers = await Promise.all(
                fileParts.map(fetchWithProgress)
            );

            const blob = new Blob(buffers, { type: mimeType });
            const url = URL.createObjectURL(blob);

            blobURLs.push(url);

            return url;
        }

        function getParts(file, start, end) {
            const parts = [];

            for (let i = start; i <= end; i++) {
                parts.push(absoluteURL(file + ".part" + i));
            }

            return parts;
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
        }

        function loadScript(url) {
            return new Promise((resolve, reject) => {
                const script = document.createElement("script");

                script.src = url;
                script.onload = resolve;
                script.onerror = () => reject(
                    new Error("Failed to load script: " + url)
                );

                document.body.appendChild(script);
            });
        }

        async function startGame() {
            try {
                const dataParts = getParts("Build/hk.data", 1, 42);
                const wasmParts = getParts("Build/hk.wasm", 1, 2);

                const [dataUrl, codeUrl] = await Promise.all([
                    mergeFiles(
                        dataParts,
                        "application/octet-stream"
                    ),
                    mergeFiles(
                        wasmParts,
                        "application/wasm"
                    )
                ]);

                const buildUrl = absoluteURL("Build/");

                const loaderUrl =
                    absoluteURL("Build/hk.loader.js");

                const config = {
                    dataUrl: dataUrl,
                    frameworkUrl:
                        absoluteURL("Build/hk.framework.js"),
                    codeUrl: codeUrl,
                    streamingAssetsUrl:
                        absoluteURL("StreamingAssets/"),
                    companyName: "Team Cherry & Truffled",
                    productName: "Hollow Knight",
                    productVersion: "1.0"
                };

                console.log("Unity configuration:", config);
                console.log("Document URL:", location.href);
                console.log("Document base:", document.baseURI);

                container.hidden = false;

                const isMobile =
                    /iPhone|iPad|iPod|Android/i.test(
                        navigator.userAgent
                    );

                if (isMobile) {
                    container.className = "unity-mobile";
                    canvas.className = "unity-mobile";
                    config.devicePixelRatio = 1;

                    mobileWarning.style.display = "block";

                    setTimeout(() => {
                        mobileWarning.style.display = "none";
                    }, 5000);
                } else {
                    resizeCanvas();

                    window.addEventListener(
                        "resize",
                        resizeCanvas
                    );
                }

                loadingBar.style.display = "block";

                await loadScript(loaderUrl);

                if (typeof createUnityInstance !== "function") {
                    throw new Error(
                        "Unity loader did not define createUnityInstance"
                    );
                }

                /*
                 * Unity may try to resolve its URLs against
                 * location.href, which is about:srcdoc inside
                 * the WGFWP iframe.
                 *
                 * All configured asset URLs above are absolute.
                 * This avoids most relative URL resolution errors.
                 */

                const unityInstance = await createUnityInstance(
                    canvas,
                    config,
                    (progress) => {
                        progressBarFull.style.width =
                            (progress * 100) + "%";
                    }
                );

                loadingText.remove();
                loadingBar.style.display = "none";
                canvas.style.display = "block";

                console.log("Hollow Knight initialized!");

                window.unityInstance = unityInstance;

            } catch (error) {
                showError(error);
            }
        }

        startGame();
    </script>
</body>
</html>
